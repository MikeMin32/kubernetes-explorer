apiVersion: v1
kind: Namespace
metadata:
  name: k8s-explorer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: explorer-backend
  namespace: k8s-explorer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: explorer-readonly
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: explorer-readonly-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: explorer-readonly
subjects:
  - kind: ServiceAccount
    name: explorer-backend
    namespace: k8s-explorer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: explorer-backend
  namespace: k8s-explorer
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: explorer-backend
  template:
    metadata:
      labels:
        app: explorer-backend
    spec:
      serviceAccountName: explorer-backend
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: k8s-explorer-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PROMETHEUS_URL
              value: http://kps-kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: explorer-backend-pdb
  namespace: k8s-explorer
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: explorer-backend
---
apiVersion: v1
kind: Service
metadata:
  name: explorer-backend
  namespace: k8s-explorer
spec:
  selector:
    app: explorer-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: explorer-gateway
  namespace: k8s-explorer
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: explorer-gateway
  template:
    metadata:
      labels:
        app: explorer-gateway
    spec:
      terminationGracePeriodSeconds: 15

      volumes:
        - name: nginx-cache
          emptyDir: {}

      containers:
        - name: gateway
          image: k8s-explorer-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "NET_BIND_SERVICE", "SETGID", "SETUID"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: explorer-gateway-pdb
  namespace: k8s-explorer
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: explorer-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: explorer-gateway
  namespace: k8s-explorer
spec:
  selector:
    app: explorer-gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
