{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-backend" .Release.Name }}
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - pods/log
      - namespaces
      - services
      - endpoints
    verbs: ["get","list","watch"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-backend" .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-backend" .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.backend.serviceAccount.name | default (printf "%s-backend" .Release.Name) }}
    namespace: {{ .Release.Namespace }}
{{- end }}