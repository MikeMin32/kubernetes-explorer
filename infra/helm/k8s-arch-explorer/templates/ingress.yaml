{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: "le"
    traefik.ingress.kubernetes.io/router.middlewares: k8s-explorer-api-strip@kubernetescrd
spec:
  ingressClassName: traefik
  {{- if .Values.ingress.host }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | lower | quote }}
  rules:
    - host: {{ .Values.ingress.host | lower | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-gateway
                port:
                  number: 80
  {{- else }}
  # If host is not set, fail early (better than creating a catch-all ingress)
  rules: []
  {{- end }}
{{- end }}