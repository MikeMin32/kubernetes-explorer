# infra/helm/k8s-arch-explorer/values.yaml

backend:
  image:
    repository: ghcr.io/MikeMin32/k8s-explorer-backend
    tag: v0.1.0

  # Base replicas (used when autoscaling is disabled, or as initial desired state)
  replicaCount: 2

  # Environment variables for backend container
  env:
    PROMETHEUS_URL: "http://kps-kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"

  # ServiceAccount used by backend (RBAC)
  serviceAccount:
    create: true
    name: k8s-explorer-backend

  # Pod resources (HPA requires requests)
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Horizontal Pod Autoscaler
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70


gateway:
  image:
    repository: ghcr.io/MikeMin32/k8s-explorer-gateway
    tag: v0.1.0

  replicaCount: 2

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70


ingress:
  enabled: true

  # Your single domain
  host: "k8sx.tech"

  # Kubernetes ingressClassName
  className: "traefik"

  # Tell Traefik to:
  # - listen on web + websecure
  # - issue/attach TLS cert via ACME resolver "le"
  # - keep your existing middleware for /api strip (CRD middleware)
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: "le"
    traefik.ingress.kubernetes.io/router.middlewares: "k8s-explorer-api-strip@kubernetescrd"

  # Add TLS section to the Ingress spec
  tls:
    enabled: true


# RBAC (ClusterRole + ClusterRoleBinding for backend)
rbac:
  create: true