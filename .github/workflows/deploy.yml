name: deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Auth to GCP via OIDC (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Write SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Start IAP tunnel to VM (with logs)
        run: |
          set -euo pipefail
          gcloud compute start-iap-tunnel "${{ secrets.GCP_INSTANCE_NAME }}" 22 \
            --zone "${{ secrets.GCP_ZONE }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --local-host-port=localhost:2222 \
            --verbosity=info \
            > /tmp/iap-tunnel.log 2>&1 &
          echo "Tunnel PID=$!"
          sleep 3
          echo "=== IAP tunnel log ==="
          tail -n 80 /tmp/iap-tunnel.log || true
          echo "=== Listening check ==="
          ss -lntp | grep 2222 || true

      - name: Trust host key (via tunnel)
        run: |
          set -euo pipefail
          for i in {1..10}; do
            if ssh-keyscan -T 5 -p 2222 -H localhost >> ~/.ssh/known_hosts 2>/tmp/sshkeyscan.err; then
              echo "ssh-keyscan ok"
              exit 0
            fi
            echo "ssh-keyscan failed attempt $i"
            cat /tmp/sshkeyscan.err || true
            sleep 2
          done
          exit 1

      - name: SSH smoke test
        run: |
          ssh -p 2222 "${{ secrets.DEPLOY_SSH_USER }}"@localhost "whoami && hostname && uptime"